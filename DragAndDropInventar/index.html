<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inventar</title>
</head>
<body>
<h1>Inventar</h1>
 <section id="sectionItems">
    <div class="Items">
        <h2>Alle Items</h2>
        <div id="ItemContainer">                                                         
        </div>
    </div>
 </section>
 <section id="sectionQuickAccess">
    <div class="QuickAccess">
        <h2>Schnellzugriff</h2>
        <div class="QuickAccessContainer">
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
            <div class="ItemSlot" data-slot-type="quick"></div>
        </div>
    </div>
    <div id="ItemInfoContainer">
    </div>

 </section>
 <section id="sectionCharacter">
    <div class="Character">
        <h2>Character</h2>
        <div class="CharacterContainer">
            <div class="CharacterItems">
                <div class="ItemSlotContainer">
                    <p>Kopf:</p>
                    <div class="ItemSlot"  data-slot-type="head"></div>>
                </div>
                <div class="ItemSlotContainer">
                    <p>Körper:</p>
                    <div class="ItemSlot" data-slot-type="koerper"></div>>
                </div>
                <div class="ItemSlotContainer">
                    <p>Beine:</p>
                    <div class="ItemSlot" data-slot-type="legs"></div>>
                </div>
                <div class="ItemSlotContainer">
                    <p>Hals:</p>
                    <div class="ItemSlot" data-slot-type="hals"></div>>
                </div>
                <div class="ItemSlotContainer">
                    <p>Hand:</p>
                    <div class="ItemSlot" data-slot-type="hand"></div>>
                </div>
            </div>
            <img src="./img/chars/idle.png">
        </div>
    </div>
 </section>
<script src="script.js"></script>
</body>
</html>
